# CrashLoopBackOff caused by a missing ConfigMap key.
#
# app-config exists and has one key, log_level. The Deployment asks for
# db_host, which isn't there. The kubelet can't build the container's
# environment, the container dies on startup, and the pod enters
# CrashLoopBackOff.
#
# This is the shape of the demo: the pod status says CRASHLOOP, the event
# says the ConfigMap key is missing, and only correlating the two tells you
# what to actually fix.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  log_level: "debug"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo connecting to $DB_HOST; sleep 3600"]
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: db_host # does not exist in app-config
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
            requests:
              memory: "32Mi"
              cpu: "50m"
