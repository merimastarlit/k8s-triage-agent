# Pending / Unschedulable: requests 64Gi of memory, which no kind node has.
#
# This pod has no containerStatuses at all — the scheduler never placed it,
# so no container was ever created to have a status. The evidence is in
# status.conditions instead, where the scheduler writes its own
# explanation:
#
#   "0/1 nodes are available: 1 Insufficient memory."
#
# Note there are no limits here, only requests. That's deliberate: this pod
# also trips the missing-limits check, which demonstrates that a latent
# config problem and an acute scheduling failure can coexist.
---
apiVersion: v1
kind: Pod
metadata:
  name: ml-trainer
  namespace: default
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: "64Gi"
